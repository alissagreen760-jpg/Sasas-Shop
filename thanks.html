<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you! · Sasa's Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gochi+Hand&family=Shantell+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF6DC;--line:#F0DDB0;--ink:#3B2314;--maroon:#7A1631;--neon:#39FF14;--mustard:#F2B705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#24160D;--line:#3A2718;--ink:#FFF1D6}}
:root[data-theme="dark"]{--paper:#24160D;--line:#3A2718;--ink:#FFF1D6}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;text-align:center;padding:1.5rem;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;font-family:"Shantell Sans","Comic Sans MS",system-ui,sans-serif;line-height:1.6}
h1{font-family:"Bagel Fat One",system-ui,sans-serif;font-weight:400;font-size:clamp(2.8rem,12vw,6rem);line-height:.95;margin:0 0 .5rem;color:var(--maroon);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--mustard),10px 10px 0 var(--neon);transform:rotate(-3deg)}
p{font-size:1.15rem;max-width:40ch;margin:.8rem auto}
.note{font-family:"Gochi Hand",cursive;font-size:1.5rem}
a.btn{display:inline-block;margin-top:1rem;font-weight:800;text-decoration:none;background:var(--neon);color:#3B2314;border:3px solid var(--ink);border-radius:18px 6px 20px 8px;padding:.65rem 1.5rem;box-shadow:5px 5px 0 var(--ink)}
</style>
</head>
<body>
<main>
  <h1>thank you!!</h1>
  <p class="note">your order is in ♡</p>
  <p>You'll get a receipt by email. I'll pack your piece up with love and send tracking as soon as it ships.</p>
  <a class="btn" href="/">Back to the shop</a>
</main>
<script>try{localStorage.removeItem("sasa-bag")}catch(e){}</script>
</body>
</html>
